name: cubit-test
description: "Harness de teste de cubit (bloc_test + mocktail) com group vazio."
version: 0.1.0+1
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  feature:
    type: string
    description: Nome da feature (ex. auth)
    prompt: Feature?
  name:
    type: string
    description: Nome do cubit sem sufixo (ex. login → login_cubit.dart)
    prompt: Cubit?
