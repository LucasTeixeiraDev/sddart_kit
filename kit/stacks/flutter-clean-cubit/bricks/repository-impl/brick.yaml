name: repository-impl
description: "Esqueleto da implementação do repository (data), sem métodos."
version: 0.1.0+1
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  feature:
    type: string
    description: Nome da feature (ex. auth)
    prompt: Feature?
  name:
    type: string
    description: Nome base sem sufixo (padrão = feature; wallet → wallet_repository.dart)
    default: "{feature}"
