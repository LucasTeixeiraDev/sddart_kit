name: usecase
description: "Usecase (domain) que delega ao repository, com teste."
version: 0.1.0+1
environment:
  mason: ">=0.1.0 <0.2.0"
vars:
  feature:
    type: string
    description: Nome da feature (ex. auth)
    prompt: Feature?
  name:
    type: string
    description: Nome do usecase (ex. login)
    prompt: Usecase?
  repository:
    type: string
    description: Repository usado (padrão = feature)
    default: "{feature}"
  ac:
    type: string
    description: Critério de aceite coberto pelos testes
    default: AC-00
